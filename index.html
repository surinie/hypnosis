<!DOCTYPE html>
<html>
<head>
    <title>Hypnosis</title>
    <style>
        html, body {margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;}
        canvas {display: block;
            width: 100%;
            height: 100%;}
        .content {position: fixed;
            top: 30px;
            left: 30px;
            z-index: 10;
            color: white;}
        .content h1 {margin: 0 0 20px 0;
            font-size: 50px;
            font-weight: bold;}
        .controls {display: flex;
            align-items: center;}
        input[type="range"] 
        {width: 150px;}
        button {margin-left: 10px;
            padding: 5px 12px;
            background: white;
            color: black;
            border: none;
            cursor: pointer;}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="content">
        <h1>Hypnosis</h1>
        <div class="controls">
            <input type="range" id="myslider" min="0.001" max="0.1" step="0.005" value="0.05">
            <button id="clearBtn">clear</button>
        </div>
    <div style="margin-top: 40px;"><p>빈 곳을 꾸욱 눌러 보세요 ..</p></div>
    </div>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let lines = [];
let drawing = false;
let speed = 0.7;
let rotationSpeed = 0.02;
let colors = [
    "#FFFFFF",
    "#A80ED9",
    "#FF00FF",
    "#FFCBFF",
    "#696FE5",
    "#2F3AF8"
];

const slider = document.getElementById("myslider");
slider.addEventListener("input", function() {
    let value = slider.value;
    rotationSpeed = Number(value);});

const clearBtn = document.getElementById("clearBtn");
clearBtn.addEventListener("click", function() {lines = [];});

canvas.addEventListener("mousedown", function(e) {
    drawing = true;
    lines.push({
        x: e.clientX,
        y: e.clientY,
        angle: 0,
        radius: 0,
        points: [],
        rotation: 0,
        color: colors[
            Math.floor(Math.random() * colors.length)
        ]});
});

canvas.addEventListener("mouseup", function() {
    drawing = false;
});

function draw() {
    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height);

    lines.forEach(line => {

        if (
            line === lines[lines.length - 1]
            && drawing
        ) {
            line.angle += 0.1;
            line.radius += speed;

            let x =
                line.x +
                Math.cos(line.angle) * line.radius;

            let y =
                line.y +
                Math.sin(line.angle) * line.radius;

            line.points.push({
                x: x,
                y: y
            });
        }

        if (
            line !== lines[lines.length - 1]
            || !drawing
        ) {
            line.rotation += rotationSpeed;
        }

        if (line.radius > 0) {
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(
                line.x,
                line.y,
                line.radius,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        ctx.strokeStyle = line.color;
        ctx.lineWidth = 3;
        ctx.beginPath();

        line.points.forEach((point, i) => {

            let dx = point.x - line.x;
            let dy = point.y - line.y;

            let x =
                line.x +
                dx * Math.cos(line.rotation) -
                dy * Math.sin(line.rotation);

            let y =
                line.y +
                dx * Math.sin(line.rotation) +
                dy * Math.cos(line.rotation);

            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        });

        ctx.stroke();
    });

    requestAnimationFrame(draw);}

draw();

window.addEventListener("resize", function() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
